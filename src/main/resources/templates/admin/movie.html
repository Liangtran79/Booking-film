<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/layout :: admin-head('AdminSite - Quản lý Phim')}"></head>

<body>
    <!-- SIDEBAR -->
    <section th:replace="~{admin/layout :: sidebar('movies')}"></section>

    <!-- CONTENT -->
    <section id="content">
        <nav th:replace="~{admin/layout :: navbar}"></nav>

        <!-- MAIN -->
        <main class="main-content">
            <h1 class="title">Quản lý Phim</h1>
            <ul class="breadcrumbs">
                <li><a th:href="@{/admin/dashboard}">Home</a></li>
                <li class="divider">/</li>
                <li><a href="#" class="active">Phim</a></li>
            </ul>
            <br>
            <section class="table-widget">
                <h2 class="widget-title">Danh sách phim</h2>
                <div class="widget-header">
                    <a th:href="@{/admin/movies/create}" class="btn-add-movie">Thêm mới</a>
                </div>
                <div class="product-table-header">
                    <span class="column-header genre-header">ID</span>
                    <span class="column-header product-header">Hình</span>
                    <span class="column-header product-header">Phim</span>
                    <span class="column-header genre-header">Thể Loại</span>
                    <span class="column-header release-date-header">Ngày Khởi Chiếu</span>
                    <span class="column-header action-header">&nbsp;</span>
                </div>

                <ul class="product-table-list">
                    <li class="product-row" th:each="movie : ${moviePage.content}">
                        <div class="column product-id" th:text="${movie.id}">1</div>
                        <div class="column product-info">
                            <img th:src="${movie.image != null and !movie.image.startsWith('http')} ? @{'/uploads/' + ${movie.image}} : @{/img/home1.jpg}"
                                 th:alt="${movie.title}" class="movie-image">
                        </div>
                        <div class="column product-info" th:text="${movie.title}">Tên phim</div>
                        <div class="column genre-info" th:text="${movie.category != null ? movie.category.name : ''}">Hành động</div>
                        <div class="column release-date-info" th:text="${movie.releaseDate}">2026-01-01</div>
                        <div class="column action-info">
                            <a th:href="@{'/admin/movies/edit/' + ${movie.id}}" class="btn-action btn-edit" title="Chỉnh sửa">
                                <i class='bx bx-edit'></i>
                            </a>
                            <form method="POST" th:action="@{'/admin/movies/delete/' + ${movie.id}}" style="display:inline;" onsubmit="return confirm('Bạn có chắc muốn xóa phim này?');">
                                <button class="btn-action btn-edit" type="submit" aria-label="Xóa" style="cursor: pointer; background: none; border: none;">
                                    <i class='bx bx-trash' style="color: #ff2c1f;"></i>
                                </button>
                            </form>
                        </div>
                    </li>
                </ul>

                <!-- Pagination -->
                <div class="pagination" th:if="${moviePage.totalPages > 1}">
                    <a th:href="@{/admin/movies(page=0)}">&laquo;</a>
                    <a th:each="i : ${#numbers.sequence(0, moviePage.totalPages - 1)}"
                       th:href="@{/admin/movies(page=${i})}"
                       th:classappend="${moviePage.number == i} ? 'active' : ''"
                       th:text="${i + 1}">1</a>
                    <a th:href="@{/admin/movies(page=${moviePage.totalPages - 1})}">&raquo;</a>
                </div>
            </section>
        </main>
    </section>

    <th:block th:replace="~{admin/layout :: scripts}"></th:block>
</body>

</html>
