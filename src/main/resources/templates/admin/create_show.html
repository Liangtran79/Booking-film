<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: admin-head('Thêm Suất Chiếu - AdminSite')}"></head>
<body>
    <section th:replace="~{admin/layout :: sidebar('shows')}"></section>

    <section id="content">
        <nav th:replace="~{admin/layout :: navbar}"></nav>

        <main class="main-content">
            <h1 class="title">Quản lý Suất Chiếu</h1>
            <ul class="breadcrumbs">
                <li><a th:href="@{/admin/dashboard}">Home</a></li>
                <li class="divider">/</li>
                <li><a th:href="@{/admin/shows}">Suất Chiếu</a></li>
                <li class="divider">/</li>
                <li><a href="#" class="active">Thêm Mới</a></li>
            </ul>
            <br>
            <section class="table-widget">
                <h2 class="widget-title">Thêm Suất Chiếu Mới</h2>

                <div th:if="${errorMessage}" style="background-color: #ffebee; color: #d32f2f; padding: 10px 15px; border-radius: 5px; margin-bottom: 20px; border-left: 4px solid #d32f2f;" th:text="${errorMessage}"></div>

                <form th:action="@{/admin/shows/create}" method="POST">
                    <div class="form-group" style="margin-bottom: 20px;">
                        <label for="movieId" style="display: block; margin-bottom: 8px; font-weight: 500; color: #333;">Phim</label>
                        <select name="movieId" id="movieId" required
                                style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; background-color: #f9f9f9; font-size: 14px;">
                            <option value="">-- Chọn phim --</option>
                            <option th:each="m : ${movies}" th:value="${m.id}" th:text="${m.title}"></option>
                        </select>
                    </div>

                    <div class="form-group" style="margin-bottom: 20px;">
                        <label for="roomId" style="display: block; margin-bottom: 8px; font-weight: 500; color: #333;">Phòng</label>
                        <select name="roomId" id="roomId" required
                                style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; background-color: #f9f9f9; font-size: 14px;">
                            <option value="">-- Chọn phòng --</option>
                            <option th:each="r : ${rooms}" th:value="${r.id}" th:text="${r.name}"></option>
                        </select>
                    </div>

                    <div class="form-group" style="margin-bottom: 20px;">
                        <label for="showDate" style="display: block; margin-bottom: 8px; font-weight: 500; color: #333;">Ngày Chiếu</label>
                        <input type="date" id="showDate" name="showDate" required
                               style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; background-color: #f9f9f9; font-size: 14px;">
                    </div>

                    <div class="form-group" style="margin-bottom: 20px;">
                        <label for="startTime" style="display: block; margin-bottom: 8px; font-weight: 500; color: #333;">Giờ Bắt Đầu</label>
                        <input type="time" id="startTime" name="startTime" required
                               style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; background-color: #f9f9f9; font-size: 14px;">
                    </div>

                    <div class="form-group" style="margin-bottom: 20px;">
                        <label for="price" style="display: block; margin-bottom: 8px; font-weight: 500; color: #333;">Giá Vé (VNĐ)</label>
                        <input type="number" id="price" name="price" required min="0" value="75000"
                               style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; background-color: #f9f9f9; font-size: 14px;">
                        <small style="display: block; margin-top: 5px; font-size: 12px; color: #666;">Nhập giá vé không có dấu phân cách (VD: 75000)</small>
                    </div>

                    <div class="form-actions" style="display: flex; justify-content: flex-end; gap: 15px; margin-top: 30px;">
                        <a th:href="@{/admin/shows}" class="btn-cancel" style="display: inline-block; padding: 10px 20px; background-color: #e0e0e0; color: #333; border: none; border-radius: 5px; text-decoration: none; font-size: 14px;">Hủy</a>
                        <button type="submit" class="btn-submit" style="display: inline-block; padding: 10px 20px; background-color: #1775F1; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px;">Thêm Suất Chiếu</button>
                    </div>
                </form>
            </section>
        </main>
    </section>

    <th:block th:replace="~{admin/layout :: scripts}"></th:block>
</body>
</html>
