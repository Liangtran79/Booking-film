<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="admin-head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.0.9/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" th:href="@{/admin/css/style.css}">
    <link rel="stylesheet" th:href="@{/admin/css/movie.css}">
    <title th:text="${title}">AdminSite</title>
</head>
<body>

<section id="sidebar" th:fragment="sidebar(activeTab)">
    <a th:href="@{/admin/dashboard}" class="brand">
        <div class="brand-icon"><i class='bx bxs-film'></i></div>
        <div class="brand-text">
            <strong>Movies Cinema</strong>
            <small>Quản trị rạp phim</small>
        </div>
    </a>
    <ul class="side-menu">
        <li>
            <a th:href="@{/admin/dashboard}" th:classappend="${activeTab == 'dashboard'} ? 'active' : ''">
                <i class='bx bxs-dashboard icon'></i> Tổng quan
            </a>
        </li>
        <li class="divider">Quản lý</li>
        <li>
            <a th:href="@{/admin/users}" th:classappend="${activeTab == 'users'} ? 'active' : ''">
                <i class='bx bxs-user-account icon'></i> Tài khoản
            </a>
        </li>
        <li>
            <a th:href="@{/admin/movies}" th:classappend="${activeTab == 'movies'} ? 'active' : ''">
                <i class='bx bxs-film icon'></i> Phim
            </a>
        </li>
        <li>
            <a th:href="@{/admin/rooms}" th:classappend="${activeTab == 'rooms'} ? 'active' : ''">
                <i class='bx bxs-door-open icon'></i> Phòng chiếu
            </a>
        </li>
        <li>
            <a th:href="@{/admin/shows}" th:classappend="${activeTab == 'shows'} ? 'active' : ''">
                <i class='bx bxs-calendar icon'></i> Suất chiếu
            </a>
        </li>
        <li>
            <a th:href="@{/admin/bills}" th:classappend="${activeTab == 'bills'} ? 'active' : ''">
                <i class='bx bxs-receipt icon'></i> Hóa đơn &amp; Vé
            </a>
        </li>
        <li>
            <a th:href="@{/admin/ai}" th:classappend="${activeTab == 'ai'} ? 'active' : ''">
                <i class='bx bxs-bot icon'></i> Trợ lý AI
            </a>
        </li>
        <li class="divider">Hệ thống</li>
        <li>
            <a th:href="@{/}" target="_blank">
                <i class='bx bx-globe icon'></i> Trang khách hàng
            </a>
        </li>
        <li>
            <a th:href="@{/logout}" class="logout-link">
                <i class='bx bx-log-out icon'></i> Đăng xuất
            </a>
        </li>
    </ul>
</section>

<nav th:fragment="navbar">
    <i class='bx bx-menu toggle-sidebar'></i>
    <form action="#">
        <div class="form-group">
            <input type="text" placeholder="Search...">
            <i class='bx bx-search icon'></i>
        </div>
    </form>
    <a href="#" class="nav-link">
        <i class='bx bxs-bell icon'></i>
        <span class="badge">5</span>
    </a>
    <a href="#" class="nav-link">
        <i class='bx bxs-message-square-dots icon'></i>
        <span class="badge">8</span>
    </a>
    <span class="divider"></span>
    <div class="profile">
        <img th:src="@{/img/login.jpg}" alt="Avatar">
        <ul class="profile-link">
            <li><a href="#"><i class='bx bxs-user-circle icon'></i> Profile</a></li>
            <li><a href="#"><i class='bx bxs-cog'></i> Settings</a></li>
            <li><a th:href="@{/logout}"><i class='bx bxs-log-out-circle'></i> Logout</a></li>
        </ul>
    </div>
</nav>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script th:src="@{/admin/js/script.js}"></script>
</th:block>

</body>
</html>
