<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: admin-head('Chỉnh Sửa Người Dùng - AdminSite')}"></head>
<body>
    <section th:replace="~{admin/layout :: sidebar('users')}"></section>

    <section id="content">
        <nav th:replace="~{admin/layout :: navbar}"></nav>

        <main class="main-content">
            <h1 class="title">Quản lý Tài khoản</h1>
            <ul class="breadcrumbs">
                <li><a th:href="@{/admin/dashboard}">Home</a></li>
                <li class="divider">/</li>
                <li><a th:href="@{/admin/users}">Tài Khoản</a></li>
                <li class="divider">/</li>
                <li><a href="#" class="active">Chỉnh Sửa</a></li>
            </ul>
            <br>
            <section class="table-widget">
                <h2 class="widget-title">Chỉnh Sửa Người Dùng</h2>

                <div th:if="${errorMessage}" style="background-color: #ffebee; color: #d32f2f; padding: 10px 15px; border-radius: 5px; margin-bottom: 20px; border-left: 4px solid #d32f2f;" th:text="${errorMessage}"></div>

                <form th:action="@{'/admin/users/edit/' + ${user.id}}" method="POST">
                    <input type="hidden" name="userId" th:value="${user.id}">

                    <div class="form-group" style="margin-bottom: 20px;">
                        <label for="username" style="display: block; margin-bottom: 8px; font-weight: 500; color: #333;">Họ và Tên</label>
                        <input type="text" name="username" id="username" th:value="${user.username}" required
                               style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; background-color: #f9f9f9; font-size: 14px;">
                    </div>

                    <div class="form-group" style="margin-bottom: 20px;">
                        <label for="email" style="display: block; margin-bottom: 8px; font-weight: 500; color: #333;">Email</label>
                        <input type="email" name="email" id="email" th:value="${user.email}" required
                               style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; background-color: #f9f9f9; font-size: 14px;">
                    </div>

                    <div class="form-group" style="margin-bottom: 20px;">
                        <label for="newPassword" style="display: block; margin-bottom: 8px; font-weight: 500; color: #333;">Mật khẩu mới (bỏ trống nếu không đổi)</label>
                        <div style="position: relative;">
                            <input type="password" name="newPassword" id="newPassword" placeholder="Nhập mật khẩu mới..."
                                   style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; background-color: #f9f9f9; font-size: 14px;">
                            <span onclick="togglePassword()" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer;">
                                <i class='bx bx-show' id="toggleIcon"></i>
                            </span>
                        </div>
                    </div>

                    <div class="form-group" style="margin-bottom: 20px;">
                        <label for="role" style="display: block; margin-bottom: 8px; font-weight: 500; color: #333;">Vai trò</label>
                        <select name="role" id="role" required
                                style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; background-color: #f9f9f9; font-size: 14px;">
                            <option value="Admin" th:selected="${user.role == 'Admin'}">Admin</option>
                            <option value="Customer" th:selected="${user.role == 'Customer'}">Customer</option>
                        </select>
                    </div>

                    <div class="form-actions" style="display: flex; justify-content: flex-end; gap: 15px; margin-top: 30px;">
                        <a th:href="@{/admin/users}" class="btn-cancel" style="display: inline-block; padding: 10px 20px; background-color: #e0e0e0; color: #333; border: none; border-radius: 5px; text-decoration: none; font-size: 14px;">Hủy</a>
                        <button type="submit" class="btn-submit" style="display: inline-block; padding: 10px 20px; background-color: #1775F1; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px;">Cập Nhật</button>
                    </div>
                </form>
            </section>
        </main>
    </section>

    <script>
        function togglePassword() {
            var passwordField = document.getElementById("newPassword");
            var toggleIcon = document.getElementById("toggleIcon");
            if (passwordField.type === "password") {
                passwordField.type = "text";
                toggleIcon.classList.remove("bx-show");
                toggleIcon.classList.add("bx-hide");
            } else {
                passwordField.type = "password";
                toggleIcon.classList.remove("bx-hide");
                toggleIcon.classList.add("bx-show");
            }
        }
    </script>
    <th:block th:replace="~{admin/layout :: scripts}"></th:block>
</body>
</html>
