services:
  web:
    build: .
    container_name: movie_web
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: cinema
      DB_USER: root
      DB_PASS: rootpassword
      DB_PORT: 3306
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: mariadb:10.6
    container_name: movie_db
    command: [
      "mysqld",
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_unicode_ci",
      "--lower_case_table_names=1"
    ]
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cinema
    ports:
      - "3309:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./cinema.sql:/docker-entrypoint-initdb.d/cinema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -prootpassword || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: movie_phpmyadmin
    ports:
      - "8082:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      - db
    restart: always

volumes:
  db_data:
